<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" fill="none" width="100%" height="100%">
  <defs>
    <!-- Orange Pin Gradient -->
    <linearGradient id="pinGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>

    <!-- Sun Radial Gradient -->
    <linearGradient id="sunGradDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#F4511E" />
    </linearGradient>

    <!-- J Cyan-to-Blue Gradient (Vibrant for Dark Mode) -->
    <linearGradient id="jGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- K Upper Arm Gradient -->
    <linearGradient id="kArmGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- K Lower Arm Gradient -->
    <linearGradient id="kLowerGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Flight Swoosh Gradient -->
    <linearGradient id="swooshGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Mountains Gradient -->
    <linearGradient id="mountGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- ================= SUN ================= -->
  <g id="sun">
    <path d="M 185 85 A 42 42 0 0 1 269 85 Z" fill="url(#sunGradDark)" />
    <!-- Soft Sunlight Clouds -->
    <path d="M 175 76 Q 185 73 195 76 Q 200 76 205 77 L 175 77 Z" fill="#FFE0B2" opacity="0.9" />
    <path d="M 245 78 Q 255 75 268 78 L 245 78 Z" fill="#FFE0B2" opacity="0.9" />
  </g>

  <!-- ================= MOUNTAINS IN FRONT OF SUN ================= -->
  <g id="mountains-sun">
    <!-- Mountain Base Silhouette -->
    <path d="M 165 85 L 180 77 L 195 83 L 208 67 L 225 82 L 236 75 L 248 85 Z" fill="url(#mountGradDark)" />
    <!-- Center Highest Peak -->
    <polygon points="208,67 225,82 236,75 248,85 165,85 180,77 195,83" fill="#0284C7" />
    <polygon points="208,67 218,85 225,82" fill="#0369A1" />
    <!-- Snowcap on center peak -->
    <polygon points="208,67 202,74 205,73 208,76 211,73 214,75 212,71" fill="#FFFFFF" />
    <!-- Snowcap on left peak -->
    <polygon points="180,77 176,82 178,81 180,83 182,81 184,82" fill="#FFFFFF" />
    <!-- Snowcap on right peak -->
    <polygon points="236,75 232,80 234,79 236,81 238,79 240,80" fill="#FFFFFF" />
  </g>

  <!-- ================= J HOOK & MOUNTAIN ================= -->
  <!-- J Body -->
  <path d="M 82 66 L 98 66 L 98 116 C 98 128 91 138 78 143 C 65 147 48 144 38 135 C 32 129 27 121 34 112 C 40 105 48 112 53 118 C 60 126 69 127 75 122 C 81 117 82 110 82 102 Z" fill="url(#jGradDark)" />

  <!-- Mountain Peaks inside J Hook -->
  <g id="j-mountain">
    <path d="M 33 118 L 47 104 L 62 118 L 74 109 L 83 120 L 33 125 Z" fill="#0369A1" />
    <!-- Snowcap on primary peak -->
    <polygon points="47,104 42,112 45,110 47,114 50,110 52,112" fill="#FFFFFF" />
    <polygon points="47,104 50,110 52,112 47,115" fill="#E0F2FE" />
    <!-- Snowcap on secondary peak -->
    <polygon points="74,109 71,114 73,113 74,115 76,113 78,114" fill="#FFFFFF" />
  </g>

  <!-- ================= ORANGE LOCATION PIN ================= -->
  <g id="map-pin">
    <!-- Pin Marker Shape -->
    <path d="M 80 28 C 69 28 60 37 60 48 C 60 59 73 72 80 78 C 87 72 100 59 100 48 C 100 37 91 28 80 28 Z" fill="url(#pinGradDark)" filter="drop-shadow(0px 2px 4px rgba(255,87,34,0.5))" />
    <!-- Pin Center Hole -->
    <circle cx="80" cy="47" r="7.5" fill="#FFFFFF" />
  </g>

  <!-- ================= THE K ================= -->
  <!-- K Vertical Stem (blended with J) -->
  <path d="M 98 66 L 118 66 L 118 135 L 98 135 Z" fill="#0284C7" />

  <!-- K Upper Arm (Cyan Gradient) -->
  <path d="M 118 90 L 163 60 L 186 60 L 134 98 Z" fill="url(#kArmGradDark)" />

  <!-- K Lower Arm -->
  <path d="M 125 93 L 172 135 L 146 135 L 110 102 Z" fill="url(#kLowerGradDark)" />

  <!-- ================= SWOOSH FLIGHT PATH ================= -->
  <g id="flight-swoosh">
    <!-- Main Sweeping Ribbon -->
    <path d="M 52 142 C 85 142 108 122 138 98 C 172 71 216 75 272 73 C 285 72 298 68 312 60 C 298 65 282 68 268 68 C 210 68 166 76 128 103 C 102 122 80 137 52 142 Z" fill="url(#swooshGradDark)" />
    <!-- Inner White Highlight Ribbon -->
    <path d="M 105 124 C 132 102 172 82 225 80 C 255 79 285 75 305 65 C 285 71 255 74 225 75 C 172 77 132 96 105 124 Z" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- ================= AIRPLANE ================= -->
  <g id="airplane" transform="translate(305, 50) rotate(10)">
    <!-- Fuselage & Wings in Bright Luminous Sky Blue for Dark Mode -->
    <path d="M 28 5 L 18 10 L 14 3 L 11 5 L 13 12 L 2 17 L 0 13 L -3 15 L -1 21 L -6 24 L -6 27 L 1 24 L 14 17 L 18 23 L 21 21 L 19 16 L 31 10 C 34 8 34 6 31 5 Z" fill="#38BDF8" />
  </g>

  <!-- ================= VOYAGE TYPOGRAPHY IN CRISP WHITE FOR DARK MODE ================= -->
  <g id="voyage-text" class="text-fill" fill="#FFFFFF">
    <!-- V -->
    <path d="M 128 98 L 141 98 L 153 133 L 154 133 L 166 98 L 178 98 L 160 144 L 146 144 Z" />
    <!-- o -->
    <path d="M 197 106 C 187 106 179 114 179 125 C 179 136 187 144 197 144 C 207 144 215 136 215 125 C 215 114 207 106 197 106 Z M 197 116 C 202 116 205 120 205 125 C 205 130 202 134 197 134 C 192 134 189 130 189 125 C 189 120 192 116 197 116 Z" />
    <!-- y -->
    <path d="M 220 108 L 229 108 L 235 128 L 236 128 L 243 108 L 252 108 L 241 138 C 237 148 231 154 221 154 L 217 154 L 217 146 L 221 146 C 226 146 229 143 231 137 Z" />
    <!-- a -->
    <path d="M 268 116 C 265 114 262 113 258 113 C 252 113 247 117 247 122 C 247 127 251 130 258 131 L 261 131 C 265 132 268 133 268 136 C 268 139 265 141 260 141 C 255 141 251 138 250 135 L 242 139 C 244 144 251 148 260 148 C 270 148 277 143 277 135 L 277 108 L 268 108 Z M 268 124 L 268 126 C 265 125 262 124 259 123 C 257 122 256 121 256 119 C 256 117 258 116 261 116 C 264 116 266 117 268 120 Z" />
    <!-- g -->
    <path d="M 295 106 C 285 106 278 114 278 125 C 278 136 285 144 295 144 C 300 144 305 141 308 137 L 308 142 C 308 149 303 153 296 153 C 290 153 286 150 284 146 L 277 150 C 280 157 287 161 296 161 C 309 161 317 153 317 140 L 317 108 L 308 108 L 308 113 C 305 109 300 106 295 106 Z M 297 114 C 302 114 306 119 306 125 C 306 131 302 136 297 136 C 292 136 288 131 288 125 C 288 119 292 114 297 114 Z" />
    <!-- e -->
    <path d="M 334 106 C 323 106 315 114 315 125 C 315 136 323 144 334 144 C 342 144 348 140 351 134 L 343 130 C 341 133 338 136 334 136 C 329 136 325 132 324 127 L 352 127 C 352 126 352 125 352 123 C 352 113 345 106 334 106 Z M 324 121 C 325 116 329 113 334 113 C 339 113 343 116 344 121 Z" />
  </g>
</svg>
