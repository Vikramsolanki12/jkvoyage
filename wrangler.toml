name = "jkvoyage"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Optional: You can paste your API keys directly here instead of using the Cloudflare Dashboard:
[vars]
# GEMINI_API_KEY = "AIzaSy..."
# VITE_GOOGLE_PLACES_API_KEY = "AIzaSy..."

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true
html_handling = "none"
