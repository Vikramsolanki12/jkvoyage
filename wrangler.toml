name = "jkvoyage"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

[vars]
# Set your GEMINI_API_KEY in Cloudflare Dashboard: Settings > Variables & Secrets
# or via command: npx wrangler secret put GEMINI_API_KEY
# (Avoid hardcoding secrets directly in git to satisfy GitHub Secret Push Protection)

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true
html_handling = "none"
